name: CI

# LightPrism 的门禁只跑纯标准库测试与 CLI 自检：
# 骨架阶段不含训练代码，凡是需要 torch/tokenizers 的路径都不该出现在这里。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip pytest
          # 纯标准库门禁：不装 torch，验证 test_model.py 里的 importorskip 真的跳过了
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest -q
      - name: CLI self-check (tokens / budget)
        run: |
          python -m lightprism tokens --json > /dev/null
          python -m lightprism budget --json > /dev/null
        env:
          PYTHONPATH: src
      - name: Verify budget sums to 64K
        run: |
          python - <<'PY'
          import json, subprocess, sys, os
          env = dict(os.environ, PYTHONPATH="src")
          out = subprocess.run([sys.executable, "-m", "lightprism", "budget", "--json"],
                               capture_output=True, text=True, env=env, check=True)
          data = json.loads(out.stdout)
          assert data["total_allocated"] == 65536, data["total_allocated"]
          assert data["remaining"] == 0, data["remaining"]
          assert data["ok"] is True, data["issues"]
          print("budget ok:", data["total_allocated"])
          PY
      - name: Parse example sequence
        run: python -m lightprism parse examples/demo.prism.txt
        env:
          PYTHONPATH: src
      - name: Model config arithmetic
        run: |
          python -m lightprism config configs/300m.json
          python -m lightprism config configs/1b.json
        env:
          PYTHONPATH: src
      - name: Train smoke (tiny model, few steps)
        run: python -m lightprism.train --data data/samples.jsonl --steps 3 --seq-len 96 --batch-size 2 --log-every 1 --out-dir /tmp/lp_smoke
        env:
          PYTHONPATH: src
